# ─────────────────────────────────────────────────────────────
#  国内服务器加速配置（Nginx）
#  用途：备案通过后，让 www.vobl.cn 走国内服务器反代 Cloudflare Pages
#  放置：/etc/nginx/conf.d/vobl.cn.conf
#  ─────────────────────────────────────────────────────────────

# HTTP → 仅用于证书签发/续期
server {
    listen 80;
    listen [::]:80;
    server_name www.vobl.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vobl.cn;

    # certbot 会自动写入这两行
    ssl_certificate     /etc/letsencrypt/live/www.vobl.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.vobl.cn/privkey.pem;

    # 基础安全头（与原站一致）
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 缓存目录（提前创建：mkdir -p /var/cache/nginx/vobl）
    proxy_cache_path /var/cache/nginx/vobl levels=1:2 keys_zone=VOBL:10m max_size=2g inactive=7d;

    location / {
        proxy_cache VOBL;
        proxy_cache_valid 200 1d;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_pass https://guojiayin-photography.pages.dev;
        proxy_set_header Host guojiayin-photography.pages.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Accept-Encoding "";   # 保留原文让 gzip 正常
        proxy_ssl_server_name on;
    }

    # 原图下载：反代 R2 公共桶（国内访客下载原图也走服务器缓存）
    location /originals/ {
        proxy_cache VOBL;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating;

        rewrite ^/originals/(.*)$ /$1 break;
        proxy_pass https://pub-7d773d4fe41a44659b035738f0562d96.r2.dev;
        proxy_set_header Host pub-7d773d4fe41a44659b035738f0562d96.r2.dev;
        proxy_ssl_server_name on;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
