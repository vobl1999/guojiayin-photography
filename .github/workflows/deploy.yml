# 可选：GitHub Actions 直接部署到 Cloudflare Pages
# 推荐使用 Cloudflare Pages 面板的「Git 集成」，那样无需本文件。
# 若要用本工作流：
#   1. 在 GitHub 仓库 Settings → Secrets 添加：
#      CLOUDFLARE_API_TOKEN   （Pages 编辑权限的 API Token）
#      CLOUDFLARE_ACCOUNT_ID  （你的 Cloudflare 账户 ID）
#   2. 把下方的 on: workflow_dispatch 改为 push 即可自动部署
name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=guojiayin
